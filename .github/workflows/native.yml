name: Native C17
on:
  push:
    paths: ["native/**", "README.md", "NOTICE", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "README.md", "NOTICE", ".github/workflows/native.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, checks and generated demo
        run: make -C native CC=${{ matrix.compiler }} check demo
      - name: Address and undefined-behavior checks
        if: matrix.compiler == 'clang'
        run: make -C native CC=clang sanitize
      - name: Fixed-buffer memory acceptance
        if: matrix.compiler == 'gcc'
        working-directory: native
        run: ./build/test-native --memory
